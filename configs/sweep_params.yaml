# ========================================================================
# Configuration: Deterministic Range Continuations & One-At-A-Time Sweeps
# Purpose: Maps out the emergence thresholds of the coexisting bistable regimes
# ========================================================================

primary_control_variable_sweep:
  parameter_name: "Systemic Vascular Resistance"
  symbol: "Rsys"
  lower_bound: 0.5
  upper_bound: 2.0
  step_size: 0.02
  units: "mmHg*s/mL"

secondary_sensitivity_bounds:
  Emax:
    min: 1.5
    max: 3.0
    step: 0.05
    units: "mmHg/mL"
  Ca:
    min: 1.0
    max: 2.5
    step: 0.05
    units: "mL/mmHg"
  Cv:
    min: 60.0
    max: 150.0
    step: 2.0
    units: "mL/mmHg"
