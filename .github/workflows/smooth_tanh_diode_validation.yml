name: Smooth tanh diode final validation

on:
  push:
    branches:
      - validation/smooth-tanh-diode-final-20261119
    paths:
      - simulations/validate_smooth_tanh_diode.py
      - .github/workflows/smooth_tanh_diode_validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 numba==0.61.2 llvmlite==0.44.0
      - name: Compile
        run: python -m py_compile simulations/validate_smooth_tanh_diode.py
      - name: Run smooth-valve validation
        run: python simulations/validate_smooth_tanh_diode.py
      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: smooth-tanh-diode-validation
          path: results/smooth_tanh_validation/
          if-no-files-found: error
