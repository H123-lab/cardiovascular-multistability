name: Continuous Integration Testing Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository State
      uses: actions/checkout@v4

    - name: Setup Python Virtual Engine Env
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Pinned Dependencies Matrix
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    - name: Execute Automated Test Infrastructure Suite
      run: |
        pytest tests/
