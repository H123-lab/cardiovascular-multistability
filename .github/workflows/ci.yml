name: Continuous Integration Testing Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'results/processed/**'
      - '**.md'
  pull_request:
    paths:
      - 'simulations/**'
      - 'model/**'
      - '.github/workflows/**'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-numerical-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 numba==0.61.2 llvmlite==0.44.0
      - name: Compile audit script
        run: python -m py_compile simulations/run_fast_rk4_audit.py
      - name: Run bounded smoke audit
        env:
          AUDIT_SWEEP_SECONDS: '2.4'
          AUDIT_BASELINE_SECONDS: '300'
        run: python simulations/run_fast_rk4_audit.py
      - name: Verify required audit outputs
        run: |
          import csv
          from pathlib import Path
          p = Path('results/processed')
          required = {
              'audit_sweep_transcript.log': None,
              'audit_execution_transcript.log': None,
              'coexistence_multi_Rsys_summary.csv': 6,
              'solver_convergence.csv': 5,
              'sweep_comparison.csv': 62,
              'floquet_stability_summary.csv': 7,
          }
          for name, expected in required.items():
              f = p / name
              assert f.is_file() and f.stat().st_size > 0, f'missing/empty: {f}'
              if expected is not None:
                  with f.open(newline='') as stream:
                      count = sum(1 for _ in csv.reader(stream))
                  assert count == expected, f'{name}: expected {expected} rows, got {count}'
              print(f'PASS {name}')
          floquet = p / 'floquet_stability_summary.csv'
          with floquet.open(newline='') as stream:
              floquet_rows = list(csv.DictReader(stream))
          assert len(floquet_rows) == 6, f'expected six Floquet rows, got {len(floquet_rows)}'
          for row in floquet_rows:
              assert float(row['neutral_multiplier_distance']) < 1e-5, row
              assert float(row['max_transverse_multiplier_modulus']) < 1.0, row
              assert row['strict_orbital_stability'] == '1', row
          print('PASS all six Floquet orbit stability rows')
