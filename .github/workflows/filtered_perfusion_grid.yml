name: Focused filtered-perfusion calibration

on:
  push:
    branches: [diagnostic/filtered-perfusion-focused-grid-20261118]
  pull_request:
    branches: [main]
    paths:
      - 'simulations/calibrate_filtered_perfusion_grid.py'
      - '.github/workflows/filtered_perfusion_grid.yml'

permissions:
  contents: read

jobs:
  focused-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 numba==0.61.2 llvmlite==0.44.0
      - name: Compile scan
        run: python -m py_compile simulations/calibrate_filtered_perfusion_grid.py
      - name: Run focused 640-combination grid
        run: python simulations/calibrate_filtered_perfusion_grid.py
      - name: Verify scan outputs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('results/diagnostic/filtered_grid')
          f=p/'filtered_perfusion_grid_summary.csv'
          assert f.exists() and f.stat().st_size>0
          with f.open(newline='') as s: rows=list(csv.DictReader(s))
          assert len(rows)==640, f'Expected 640 combinations, got {len(rows)}'
          w=json.loads((p/'filtered_perfusion_winner.json').read_text())
          print(f'PASS: {len(rows)} combinations; winner={w.get("all_gates",False)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: filtered-perfusion-focused-grid-${{ github.sha }}
          path: results/diagnostic/filtered_grid/
          if-no-files-found: error
          retention-days: 90
