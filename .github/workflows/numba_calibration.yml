name: Numba parameter calibration scan

on:
  pull_request:
    paths:
      - 'simulations/calibrate_numba_grid.py'
      - '.github/workflows/numba_calibration.yml'

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout calibration branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 numba==0.61.2 llvmlite==0.44.0
      - name: Compile calibration script
        run: python -m py_compile simulations/calibrate_numba_grid.py
      - name: Run full deterministic calibration grid
        run: python simulations/calibrate_numba_grid.py
      - name: Print calibration outputs
        if: always()
        run: |
          echo '## Calibration transcript' >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/calibration/calibration_transcript.log ]; then
            cat results/calibration/calibration_transcript.log | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Calibration transcript was not generated.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '## Calibration scan CSV (first 100 lines)' >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/calibration/calibration_scan.csv ]; then
            head -n 100 results/calibration/calibration_scan.csv | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '## Coexistence summary' >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/calibration/coexistence_multi_Rsys_summary.csv ]; then
            cat results/calibration/coexistence_multi_Rsys_summary.csv | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload calibration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numba-calibration-${{ github.sha }}
          path: results/calibration/
          if-no-files-found: warn
          retention-days: 90
