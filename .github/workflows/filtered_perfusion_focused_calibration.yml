name: Focused filtered-perfusion calibration
on:
  push:
    branches: [calibration/filtered-perfusion-focused-20261118]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.1.3 numba==0.61.2 llvmlite==0.44.0
      - name: Compile calibration
        run: python -m py_compile simulations/calibrate_filtered_perfusion_grid.py
      - name: Run focused 640-combination calibration
        run: python -u simulations/calibrate_filtered_perfusion_grid.py | tee results_calibration_console.log
      - name: Upload calibration outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filtered-perfusion-focused-calibration
          path: |
            results/calibration/
            results_calibration_console.log
