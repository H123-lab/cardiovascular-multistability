name: Reproduce Cardiovascular Model Results

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'simulations/**'
      - 'model/**'
      - '.github/workflows/generate_sweep_csvs.yml'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: cardiovascular-reproducibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-verify-results:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 numba==0.61.2 llvmlite==0.44.0
      - name: Record execution environment
        run: |
          mkdir -p results/processed
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Ref: $GITHUB_REF"
            echo "Python: $(python --version)"
            echo "UTC execution time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            python -m pip freeze
          } > results/processed/reproducibility_metadata.txt
      - name: Remove stale generated outputs
        run: |
          rm -f results/processed/forward_sweep.csv
          rm -f results/processed/reverse_sweep.csv
          rm -f results/processed/sweep_comparison.csv
          rm -f results/processed/coexistence_multi_Rsys_summary.csv
          rm -f results/processed/coexistence_R140_summary.csv
          rm -f results/processed/coexistence_R140_trajectories.csv
          rm -f results/processed/baseline_summary.csv
          rm -f results/processed/solver_convergence.csv
          rm -f results/processed/audit_sweep_transcript.log
          rm -f results/processed/audit_execution_transcript.log
          rm -f results/processed/floquet_stability_summary.csv
          rm -f results/processed/perturbation_experiments_summary.csv
      - name: Compile audit script
        run: python -m py_compile simulations/run_fast_rk4_audit.py
      - name: Run full 300-second-per-point audit
        env:
          AUDIT_SWEEP_SECONDS: '300'
          AUDIT_BASELINE_SECONDS: '300'
        run: python simulations/run_fast_rk4_audit.py
      - name: Verify generated outputs and dimensions
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          base = Path('results/processed')
          expected = {
              'forward_sweep.csv': 62,
              'reverse_sweep.csv': 62,
              'sweep_comparison.csv': 62,
              'coexistence_multi_Rsys_summary.csv': 7,
              'coexistence_R140_summary.csv': 5,
              'coexistence_R140_trajectories.csv': 802,
              'baseline_summary.csv': 6,
              'solver_convergence.csv': 5,
              'floquet_stability_summary.csv': 7,
              'perturbation_experiments_summary.csv': 25,
          }
          for name, nrows in expected.items():
              path = base / name
              assert path.is_file() and path.stat().st_size > 0, f'missing/empty {name}'
              with path.open(newline='') as stream:
                  rows = list(csv.reader(stream))
              assert len(rows) == nrows, f'{name}: expected {nrows} rows, got {len(rows)}'
              print(f'PASS {name}: {nrows-1} data rows')
          floquet_path = base / 'floquet_stability_summary.csv'
          with floquet_path.open(newline='') as stream:
              floquet_rows = list(csv.DictReader(stream))
          assert len(floquet_rows) == 6, f'expected six orbit/resistance rows, got {len(floquet_rows)}'
          expected_pairs = {(r, orbit) for r in ('1.24', '1.32', '1.40') for orbit in ('Upper_Compensated', 'Lower_Hypoperfused')}
          assert {(row['Rsys'], row['Orbit']) for row in floquet_rows} == expected_pairs
          for row in floquet_rows:
              assert float(row['neutral_multiplier_distance']) < 1e-5, row
              assert float(row['max_transverse_multiplier_modulus']) < 1.0, row
              assert row['strict_orbital_stability'] == '1', row
          print('PASS floquet_stability_summary.csv: all six orbit stability gates passed')
          perturb_path = base / 'perturbation_experiments_summary.csv'
          with perturb_path.open(newline='') as stream:
              perturb_rows = list(csv.DictReader(stream))
          assert len(perturb_rows) == 24, f'expected 24 perturbation cases, got {len(perturb_rows)}'
          expected_cases = {
              (r, orbit, delta)
              for r in ('1.32', '1.40')
              for orbit in ('Upper_Compensated', 'Lower_Hypoperfused')
              for delta in ('-0.15', '-0.10', '0.10', '0.15')
          }
          observed_cases = {(row['Rsys'], row['Initial_Orbit'], row['Delta_VLV_Frac']) for row in perturb_rows}
          assert observed_cases == expected_cases, 'perturbation case grid is incomplete or duplicated'
          for row in perturb_rows:
              assert float(row['Final_Cycle_Diff']) < 1e-8, row
              assert row['Final_Orbit'] in ('Upper_Compensated', 'Lower_Hypoperfused'), row
              assert row['Basin_Switched'] in ('0', '1'), row
          print('PASS all 24 conserved-volume perturbation cases')
          for name in ('audit_sweep_transcript.log','audit_execution_transcript.log'):
              path = base / name
              assert path.is_file() and path.stat().st_size > 0, f'missing/empty {name}'
              print(f'PASS {name}')
          PY
      - name: Print complete Floquet stability summary
        run: cat results/processed/floquet_stability_summary.csv
      - name: Print complete perturbation benchmark
        run: cat results/processed/perturbation_experiments_summary.csv
      - name: Upload full reproducibility outputs
        uses: actions/upload-artifact@v4
        with:
          name: cardiovascular-reproducibility-${{ github.sha }}
          path: |
            results/processed/forward_sweep.csv
            results/processed/reverse_sweep.csv
            results/processed/sweep_comparison.csv
            results/processed/coexistence_multi_Rsys_summary.csv
            results/processed/coexistence_R140_summary.csv
            results/processed/coexistence_R140_trajectories.csv
            results/processed/baseline_summary.csv
            results/processed/solver_convergence.csv
            results/processed/audit_sweep_transcript.log
            results/processed/audit_execution_transcript.log
            results/processed/floquet_stability_summary.csv
            results/processed/perturbation_experiments_summary.csv
            results/processed/reproducibility_metadata.txt
          if-no-files-found: error
          retention-days: 90
