
name: Reproduce Cardiovascular Model Results

on:
  workflow_dispatch:
  push:
    paths:
      - "simulations/**"
      - "model/**"
      - "results/**"
      - ".github/workflows/generate_sweep_csvs.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "simulations/**"
      - "model/**"
      - "results/**"
      - ".github/workflows/generate_sweep_csvs.yml"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: cardiovascular-reproducibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-results:
    name: Generate and verify numerical outputs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 \
            numba==0.61.2 \
            llvmlite==0.44.0

      - name: Record execution environment
        run: |
          mkdir -p results/processed
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Branch: $GITHUB_REF"
            echo "Python: $(python --version)"
            echo "UTC execution time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "Installed packages:"
            python -m pip freeze
          } > results/processed/reproducibility_metadata.txt

            - name: Check Python syntax
        run: |
          pip install autopep8
          autopep8 --in-place simulations/run_fast_rk4_audit.py
          python -m py_compile simulations/run_fast_rk4_audit.py


      - name: Remove previous generated outputs
        run: |
          rm -f results/processed/forward_sweep.csv
          rm -f results/processed/reverse_sweep.csv
          rm -f results/processed/sweep_comparison.csv
          rm -f results/processed/coexistence_multi_Rsys_summary.csv
          rm -f results/processed/coexistence_R140_summary.csv
          rm -f results/processed/coexistence_R140_trajectories.csv
          rm -f results/processed/baseline_summary.csv
          rm -f results/processed/solver_convergence.csv
          rm -f results/processed/audit_execution_transcript.log
          rm -f results/processed/audit_sweep_transcript.log

      - name: Execute numerical simulation and audit
        run: |
          python simulations/run_fast_rk4_audit.py

      - name: Verify generated files
        run: |
          set -euo pipefail

          required_files=(
            forward_sweep.csv
            reverse_sweep.csv
            sweep_comparison.csv
            coexistence_multi_Rsys_summary.csv
            coexistence_R140_summary.csv
            coexistence_R140_trajectories.csv
            baseline_summary.csv
            solver_convergence.csv
            audit_execution_transcript.log
            audit_sweep_transcript.log
          )

          for file in "${required_files[@]}"; do
            path="results/processed/$file"

            if [ ! -s "$path" ]; then
              echo "::error::Missing or empty output: $path"
              exit 1
            fi

            echo "Verified: $path"
          done

      - name: Verify expected data dimensions
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          base = Path("results/processed")

          expected = {
              "forward_sweep.csv": 62,
              "reverse_sweep.csv": 62,
              "sweep_comparison.csv": 62,
              "coexistence_multi_Rsys_summary.csv": 7,
              "coexistence_R140_trajectories.csv": 802,
              "solver_convergence.csv": 5,
          }

          for filename, expected_rows in expected.items():
              path = base / filename
              with path.open(newline="") as f:
                  rows = list(csv.reader(f))

              if len(rows) != expected_rows:
                  raise SystemExit(
                      f"{filename}: expected {expected_rows} rows "
                      f"including header; found {len(rows)}"
                  )

              print(f"{filename}: {len(rows)-1} data rows verified")
          PY

      - name: Upload reproducibility outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardiovascular-results-${{ github.sha }}
          path: results/processed/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload reproducibility outputs
           






      



