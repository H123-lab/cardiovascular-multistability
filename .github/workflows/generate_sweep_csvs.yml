name: Generate Genuine Sweep CSVs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-sweeps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install GNU Octave
        run: sudo apt-get update && sudo apt-get install -y octave

      - name: Run forward/reverse RK4 sweeps and audit
        run: |
          octave --no-gui --eval "run('simulations/run_forward_reverse_sweeps.m'); run('tests/generate_sweep_audit.m'); run('tests/generate_audit_transcript.m');"
          git rm -f results/processed/equilibria.csv results/processed/bifurcation_points.csv || true

      - name: Commit genuine CSV outputs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/processed/
          git diff --staged --quiet || git commit -m "data: commit genuine cloud-computed 61-row sweep CSVs and audit log"
          git pull --rebase origin main
          git push origin main

