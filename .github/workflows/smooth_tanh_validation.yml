name: Smooth tanh diode validation (temporary)
on:
  push:
    branches: [validation/smooth-tanh-diode-20261119]
    paths:
      - model/cardiovascular_model.m
      - model/flow_and_valves.m
      - simulations/validate_smooth_tanh_diode.py
      - .github/workflows/smooth_tanh_validation.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.1.3 numba==0.61.2 llvmlite==0.44.0
      - run: python -m py_compile simulations/validate_smooth_tanh_diode.py
      - run: python simulations/validate_smooth_tanh_diode.py
      - uses: actions/upload-artifact@v4
        with:
          name: smooth-tanh-diode-validation
          path: results/validation/smooth_tanh/
          if-no-files-found: error
          retention-days: 90
