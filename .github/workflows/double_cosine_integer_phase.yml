name: Double-Cosine Elastance Integer-Phase Validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'simulations/validate_double_cosine_integer_phase.py'
      - '.github/workflows/double_cosine_integer_phase.yml'
permissions:
  contents: read
concurrency:
  group: double-cosine-integer-phase
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy==2.1.3 numba==0.61.2 llvmlite==0.44.0
      - run: python -m py_compile simulations/validate_double_cosine_integer_phase.py
      - name: Run waveform and parameter validation
        run: python simulations/validate_double_cosine_integer_phase.py
      - name: Verify evidence files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('double_cosine_results')
          for n in ('double_cosine_parameter_scan.csv','double_cosine_full_results.json','summary.json','double_cosine_validation.log'):
              assert (p/n).is_file() and (p/n).stat().st_size>0, n
          s=json.loads((p/'summary.json').read_text())
          assert s['dt_s']==0.001 and s['periodicity_threshold']==1e-8
          print('candidate_found=',s['candidate_found'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: double-cosine-integer-phase-validation
          path: double_cosine_results/
          if-no-files-found: error
          retention-days: 90
