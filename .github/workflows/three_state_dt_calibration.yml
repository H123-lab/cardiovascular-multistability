name: Three-state diode and calibration diagnostic

on:
  push:
    branches:
      - diagnostic/three-state-dt-and-calibration-20261118
    paths:
      - simulations/diagnose_three_state_dt_calibration.py
      - .github/workflows/three_state_dt_calibration.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 numba==0.61.2 llvmlite==0.44.0
      - name: Compile diagnostic
        run: python -m py_compile simulations/diagnose_three_state_dt_calibration.py
      - name: Run 3-state audit
        run: python simulations/diagnose_three_state_dt_calibration.py
      - name: Upload diagnostic outputs
        uses: actions/upload-artifact@v4
        with:
          name: three-state-dt-calibration-diagnostic
          path: results/diagnostics/three_state/
          if-no-files-found: error
