name: Best-candidate slow-drift diagnostic

on:
  push:
    branches: [diagnostic/slow-drift-best-candidate-20261118]
  pull_request:
    branches: [main]
    paths:
      - 'simulations/diagnose_best_candidate_slow_drift.py'
      - '.github/workflows/best_candidate_slow_drift.yml'

permissions:
  contents: read

jobs:
  slow-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install numpy==2.1.3 numba==0.61.2 llvmlite==0.44.0
      - name: Compile diagnostic
        run: python -m py_compile simulations/diagnose_best_candidate_slow_drift.py
      - name: Run 300, 600, 1200 and 2000 second integrations
        run: python simulations/diagnose_best_candidate_slow_drift.py
      - name: Validate diagnostic outputs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('results/diagnostic/slow_drift_best_candidate')
          with (p/'cycle_drift_checkpoints.csv').open(newline='') as f: a=list(csv.DictReader(f))
          with (p/'forward_reverse_separation_1500_2000s.csv').open(newline='') as f: b=list(csv.DictReader(f))
          s=json.loads((p/'diagnostic_summary.json').read_text())
          assert len(a)==30, len(a)
          assert len(b)==6, len(b)
          assert len(s['cycle_decay_log_fits'])==6
          print(f'Validated {len(a)} cycle checkpoints and {len(b)} branch-separation measurements.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: best-candidate-slow-drift-diagnostic-${{ github.sha }}
          path: results/diagnostic/slow_drift_best_candidate/
          if-no-files-found: error
          retention-days: 90
