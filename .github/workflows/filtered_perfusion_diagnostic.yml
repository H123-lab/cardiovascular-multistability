name: Filtered perfusion diagnostic (tau_p=2s)
on:
  push:
    branches: [diagnostic/mean-perfusion-tau2-20261118]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.1.3 numba==0.61.2 llvmlite==0.44.0
      - name: Verify script syntax
        run: python -m py_compile simulations/diagnose_filtered_perfusion.py
      - name: Run filtered-perfusion test
        run: python simulations/diagnose_filtered_perfusion.py
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filtered-perfusion-tau2-diagnostic
          path: results/diagnostic/
